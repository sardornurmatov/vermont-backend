server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vermont_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
  admin-password: ${ADMIN_PASSWORD:change-this-admin-password}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5500}
