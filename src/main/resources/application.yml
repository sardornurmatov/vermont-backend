server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vermont_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

app:
  jwt-secret: ${JWT_SECRET}
  admin-password: ${ADMIN_PASSWORD}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5500}
