services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vermont_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["vermont_pg:/var/lib/postgresql/data"]
  backend:
    build: .
    depends_on: [postgres]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vermont_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: replace-with-at-least-32-random-characters
      ADMIN_PASSWORD: replace-this-admin-password
      FRONTEND_ORIGIN: http://localhost:5500
    ports: ["8080:8080"]
volumes:
  vermont_pg:
